<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-label="mcl-warden system context">
<title>mcl-warden system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1100" height="780"/>
<rect class="b-ext" x="40" y="30" width="320" height="136" rx="10"/>
<text class="t-name" x="56" y="58">An attacker</text>
<text class="t-type" x="56" y="76">[External system]</text>
<text class="t-desc" x="56" y="100">Fails logins on the box's real</text>
<text class="t-desc" x="56" y="116">sshd, and probes whatever else is</text>
<text class="t-desc" x="56" y="132">open, including the decoy ports</text>
<text class="t-desc" x="56" y="148">when the tarpit is on.</text>
<rect class="b-per" x="380" y="30" width="320" height="136" rx="10"/>
<text class="t-name" x="396" y="58">Service operator</text>
<text class="t-type" x="396" y="76">[Person]</text>
<text class="t-desc" x="396" y="100">Runs the box, sets the realm and</text>
<text class="t-desc" x="396" y="116">the box label, opens the decoy</text>
<text class="t-desc" x="396" y="132">ports, and lists the warden's node</text>
<text class="t-desc" x="396" y="148">id where a sentinel reads it.</text>
<rect class="b-ext" x="720" y="30" width="320" height="136" rx="10"/>
<text class="t-name" x="736" y="58">A sentinel, or any consumer</text>
<text class="t-type" x="736" y="76">[External system]</text>
<text class="t-desc" x="736" y="100">Subscribes to the three watch facts</text>
<text class="t-desc" x="736" y="116">and builds its roster from the</text>
<text class="t-desc" x="736" y="132">check-ins; attributes each one by</text>
<text class="t-desc" x="736" y="148">the verified publisher.</text>
<rect class="b-sys" x="390" y="230" width="320" height="152" rx="10"/>
<text class="t-name" x="406" y="258">mcl-warden</text>
<text class="t-type" x="406" y="276">[mcl_om mesh service, own box]</text>
<text class="t-desc" x="406" y="300">Reads the host's auth log, holds</text>
<text class="t-desc" x="406" y="316">attackers on decoy ports, and</text>
<text class="t-desc" x="406" y="332">publishes what it sees on three</text>
<text class="t-desc" x="406" y="348">facts. Holds no store, offers no</text>
<text class="t-desc" x="406" y="364">procedure of its own, never blocks.</text>
<rect class="b-ext" x="40" y="470" width="320" height="136" rx="10"/>
<text class="t-name" x="56" y="498">The box's sshd and auth log</text>
<text class="t-type" x="56" y="516">[External system]</text>
<text class="t-desc" x="56" y="540">sshd writes every failed login to</text>
<text class="t-desc" x="56" y="556">its auth log; the directory is</text>
<text class="t-desc" x="56" y="572">mounted read-only at /host/log.</text>
<text class="t-desc" x="56" y="588">The sensor tails it by inode.</text>
<rect class="b-mac" x="390" y="470" width="320" height="120" rx="10"/>
<text class="t-name" x="406" y="498">macula-realm</text>
<text class="t-type" x="406" y="516">[Macula infrastructure]</text>
<text class="t-desc" x="406" y="540">Endorses the node's identity key</text>
<text class="t-desc" x="406" y="556">and admits the boot claim; no</text>
<text class="t-desc" x="406" y="572">provider authorization is asked for.</text>
<rect class="b-mac" x="720" y="470" width="320" height="136" rx="10"/>
<text class="t-name" x="736" y="498">Macula stations, mesh DHT</text>
<text class="t-type" x="736" y="516">[Macula infrastructure]</text>
<text class="t-desc" x="736" y="540">The pinned seeds in</text>
<text class="t-desc" x="736" y="556">MACULA_STATION_SEEDS carry every fact</text>
<text class="t-desc" x="736" y="572">over QUIC; the DHT holds the node's</text>
<text class="t-desc" x="736" y="588">advertisement.</text>
<path class="edge" d="M180 166V200H440V230" marker-end="url(#a)"/>
<text class="t-rel" x="188" y="180">fails logins, and probes the decoy ports</text>
<path class="edge" d="M540 150V230" marker-end="url(#a)"/>
<text class="t-rel" x="548" y="192">deploys; sets the realm and</text>
<text class="t-rel" x="548" y="208">the decoy ports</text>
<path class="edge" d="M710 300H880V166" marker-end="url(#a)"/>
<text class="t-rel" x="718" y="292">publishes the three watch facts</text>
<path class="edge" d="M200 470V420H450V382" marker-end="url(#a)"/>
<text class="t-rel" x="208" y="440">tails the log, read-only</text>
<path class="edge" d="M550 382V470" marker-end="url(#a)"/>
<text class="t-rel" x="558" y="404">boot claim</text>
<path class="edge" d="M650 382V430H880V470" marker-end="url(#a)"/>
<text class="t-rel" x="658" y="422">publishes the three facts</text>
<text class="t-desc" x="40" y="640">The warden never touches sshd, never blocks an address and never stores the log. It sees, it reports, and it holds a</text>
<text class="t-desc" x="40" y="658">decoy connection open for as long as the attacker is willing to wait.</text>
<rect class="b-sys" x="24" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="728">In scope</text>
<rect class="b-per" x="110.8" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="728">Person</text>
<rect class="b-mac" x="184.39999999999998" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="728">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="728">External system</text>
<rect class="b-cmp" x="490.0" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="728">Container or component</text>
</svg>
